# ci.yml — cloud-agnostic. Runs on every PR to main: application QA
# (stage 0 in cicd-pipeline.md) plus every security-scanning stage that
# doesn't need real cloud credentials (SAST, secret scanning, IaC
# validation). The deploy-<cloud>.yml workflow (a separate file, since
# the cloud-auth step is genuinely different per cloud) picks up from
# here for anything that needs to touch real infrastructure.
#
# Copy this in whole and adjust the two "ADAPT THIS" blocks for your
# actual language/framework -- everything else is meant to work as-is.

name: ci
on:
  pull_request:
    branches: [main]

jobs:
  # ---- Stage 0: application QA (cicd-pipeline.md) ----

  backend-unit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # ADAPT THIS: your real language setup + install + test command.
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with: { node-version: "20" }
      - run: npm ci
        working-directory: apps/backend
      - run: npm test # the REAL script your package.json defines -- see cicd-pipeline.md stage 0 for why this matters
        working-directory: apps/backend
        env:
          DATABASE_URL: postgres://app:app@localhost:5432/postgres

  frontend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with: { node-version: "20" }
      - run: npm ci
        working-directory: apps/frontend
      - run: npm test # the REAL script -- must include --coverage or your framework's equivalent, not a subset
        working-directory: apps/frontend

  # ---- Security stages that don't need real cloud credentials ----

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@9887d98ae49f1f598651b556d8c8f02f3ea065cb # v3.27.0
        with:
          languages: javascript-typescript # ADAPT THIS to your real language(s)
      - uses: github/codeql-action/analyze@9887d98ae49f1f598651b556d8c8f02f3ea065cb # v3.27.0
      # Open-source alternative (no GHAS license needed): swap this job's
      # two steps for `returntocorp/semgrep-action` -- see cicd-pipeline.md
      # stage 1 for the tradeoff.

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history -- see cicd-pipeline.md stage 2 for why
      # NOT gitleaks/gitleaks-action -- that wrapper's v3 requires a paid
      # license for any organization-owned repo ("[org] is an organization.
      # License key is required.", found running this exact job on
      # secure-foundry/secure-foundry itself). The underlying gitleaks CLI
      # stays MIT-licensed regardless; run its official image directly.
      # The repo path is a positional [repo] argument to `git`, not
      # --source -- that flag belongs to gitleaks' older `detect` command
      # and v8 rejects it ("unknown flag: --source"), also found running
      # this exact job. See security-history.md.
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --verbose

  guarddog:
    # Catches a genuinely different risk class than osv-scanner/Dependabot
    # below: a newly-published MALICIOUS package (typosquat, compromised
    # maintainer account), not a known CVE in an otherwise-legitimate one.
    # No CVE has been assigned yet for a brand-new supply-chain attack --
    # osv-scanner and Dependabot both only catch already-known-vulnerable
    # packages, so neither catches this. See cicd-pipeline.md stage 4.
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install guarddog==3.2.0
      # ADAPT THIS: one `verify` call per package manifest your app has --
      # shown here for the two package.json files this template's own
      # backend-unit-tests/frontend-unit-tests jobs use.
      - run: |
          guarddog npm verify apps/backend/package.json --output-format sarif > guarddog-backend.sarif
          guarddog npm verify apps/frontend/package.json --output-format sarif > guarddog-frontend.sarif
      - uses: github/codeql-action/upload-sarif@9887d98ae49f1f598651b556d8c8f02f3ea065cb # v3.27.0
        if: always()
        with:
          sarif_file: .
          category: guarddog

  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --recursive
            ./

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_wrapper: false }
      - name: terraform fmt
        run: terraform fmt -check -recursive infra/
      - name: checkov
        uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e # v12.3125.0
        with:
          directory: infra/
          framework: terraform

  # ---- Stage 3: container image scanning + SBOM (cicd-pipeline.md) ----
  # This job doesn't build anything itself -- wire it in immediately
  # after your own build-and-push-image step (app-specific, not shown in
  # this template) runs on a push to main, scanning the exact image
  # reference you just pushed. ADAPT THIS: image-ref, and the trigger
  # (this file's own `on:` above is PR-only; give this job its own
  # `if: github.ref == 'refs/heads/main'` guard, or move it into whatever
  # workflow your build step lives in).
  container-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Trivy vulnerability scan (final image, blocking)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: your-registry/your-image:${{ github.sha }} # ADAPT THIS
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: sarif
          output: trivy-results.sarif
      - uses: github/codeql-action/upload-sarif@9887d98ae49f1f598651b556d8c8f02f3ea065cb # v3.27.0
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      # SBOM generation -- same tool, no new dependency. Increasingly
      # required for SOC 2 / customer security questionnaires / exec-order
      # supply-chain-transparency requirements; near-zero cost since Trivy
      # is already the stage 3 tool.
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: your-registry/your-image:${{ github.sha }} # ADAPT THIS -- same reference as above
          format: cyclonedx
          output: sbom.cyclonedx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90
