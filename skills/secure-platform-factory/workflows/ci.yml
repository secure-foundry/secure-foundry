# ci.yml — cloud-agnostic. Runs on every PR to main: application QA
# (stage 0 in cicd-pipeline.md) plus every security-scanning stage that
# doesn't need real cloud credentials (SAST, secret scanning, IaC
# validation). The deploy-<cloud>.yml workflow (a separate file, since
# the cloud-auth step is genuinely different per cloud) picks up from
# here for anything that needs to touch real infrastructure.
#
# Copy this in whole and adjust the two "ADAPT THIS" blocks for your
# actual language/framework -- everything else is meant to work as-is.

name: ci
on:
  pull_request:
    branches: [main]

jobs:
  # ---- Stage 0: application QA (cicd-pipeline.md) ----

  backend-unit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # ADAPT THIS: your real language setup + install + test command.
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with: { node-version: "20" }
      - run: npm ci
        working-directory: apps/backend
      - run: npm test # the REAL script your package.json defines -- see cicd-pipeline.md stage 0 for why this matters
        working-directory: apps/backend
        env:
          DATABASE_URL: postgres://app:app@localhost:5432/postgres

  frontend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with: { node-version: "20" }
      - run: npm ci
        working-directory: apps/frontend
      - run: npm test # the REAL script -- must include --coverage or your framework's equivalent, not a subset
        working-directory: apps/frontend

  # ---- Security stages that don't need real cloud credentials ----

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@9887d98ae49f1f598651b556d8c8f02f3ea065cb # v3.27.0
        with:
          languages: javascript-typescript # ADAPT THIS to your real language(s)
      - uses: github/codeql-action/analyze@9887d98ae49f1f598651b556d8c8f02f3ea065cb # v3.27.0
      # Open-source alternative (no GHAS license needed): swap this job's
      # two steps for `returntocorp/semgrep-action` -- see cicd-pipeline.md
      # stage 1 for the tradeoff.

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history -- see cicd-pipeline.md stage 2 for why
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --recursive
            ./

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_wrapper: false }
      - name: terraform fmt
        run: terraform fmt -check -recursive infra/
      - name: checkov
        uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e # v12.3125.0
        with:
          directory: infra/
          framework: terraform
